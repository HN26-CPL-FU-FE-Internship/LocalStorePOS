services:
  mysql:
    image: mysql:8.4
    container_name: restaurant-pos-db
    restart: unless-stopped
    profiles: [local]
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      # Local profile intentionally uses the root account; keep DB_USERNAME=root
      # in the backend environment unless you add a separate MySQL user.
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_DATABASE: ${DB_NAME:-restaurant_pos_db}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
