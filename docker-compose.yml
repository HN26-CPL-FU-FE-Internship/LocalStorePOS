services:
  mysql:
    image: mysql:8.4
    container_name: restaurant-pos-db

    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: restaurant_pos_db

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
